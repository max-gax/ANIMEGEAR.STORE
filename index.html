<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — AnimeGear</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        /* ── Admin-specific styles ── */
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar-brand {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--cyan), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            padding: 0 0.5rem;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 0.9rem;
            border-radius: var(--radius-sm);
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: var(--card);
            color: var(--text);
        }

        .nav-item.active {
            background: rgba(0, 245, 255, 0.1);
            color: var(--cyan);
        }

        .nav-item .icon {
            font-size: 1.1rem;
            width: 22px;
        }

        .sidebar-footer {
            margin-top: auto;
        }

        .sidebar-footer a {
            display: block;
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            text-decoration: none;
            padding: 0.5rem;
        }

        .sidebar-footer a:hover {
            color: var(--cyan);
        }

        .admin-main {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .admin-header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.4rem;
            font-weight: 700;
        }

        /* ── LOGIN ── */
        #login-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .login-card h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        #login-error {
            color: var(--pink);
            font-size: 0.82rem;
            margin-top: 0.75rem;
            display: none;
        }

        /* ── TAB CONTENT ── */
        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        /* ── STAT CARDS ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
        }

        .stat-label {
            font-size: 0.78rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            font-family: 'Orbitron', monospace;
        }

        .stat-value.cyan {
            color: var(--cyan);
        }

        .stat-value.pink {
            color: var(--pink);
        }

        .stat-value.purple {
            color: #a78bfa;
        }

        .stat-value.green {
            color: #34d399;
        }

        /* ── TABLE ── */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 0.85rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.88rem;
        }

        .data-table th {
            color: var(--muted);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.02);
            font-size: 0.78rem;
            text-transform: uppercase;
        }

        .data-table tbody tr:hover {
            background: var(--card);
        }

        .table-wrap {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            overflow-x: auto;
        }

        /* ── PRODUCT IMAGE THUMB ── */
        .prod-thumb {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            background: var(--bg3);
        }

        /* ── BADGES / STATUS ── */
        .badge {
            padding: 0.25rem 0.7rem;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-pending {
            background: rgba(100, 116, 139, 0.15);
            color: var(--muted);
            border: 1px solid var(--muted);
        }

        .badge-contacted {
            background: rgba(0, 245, 255, 0.1);
            color: var(--cyan);
            border: 1px solid var(--cyan);
        }

        .badge-shipped {
            background: rgba(124, 58, 237, 0.15);
            color: #a78bfa;
            border: 1px solid #a78bfa;
        }

        .badge-completed {
            background: rgba(52, 211, 153, 0.12);
            color: #34d399;
            border: 1px solid #34d399;
        }

        /* ── ACTION BUTTONS ── */
        .act-btn {
            padding: 0.35rem 0.8rem;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid;
            transition: all 0.2s;
        }

        .act-btn-edit {
            background: rgba(124, 58, 237, 0.1);
            border-color: #7c3aed;
            color: #a78bfa;
        }

        .act-btn-edit:hover {
            background: #7c3aed;
            color: #fff;
        }

        .act-btn-del {
            background: rgba(255, 0, 110, 0.1);
            border-color: var(--pink);
            color: var(--pink);
        }

        .act-btn-del:hover {
            background: var(--pink);
            color: #fff;
        }

        .act-btn-toggle {
            background: rgba(0, 245, 255, 0.1);
            border-color: var(--cyan);
            color: var(--cyan);
            font-size: 0.72rem;
        }

        .act-btn-toggle.unavail {
            background: rgba(100, 116, 139, 0.1);
            border-color: var(--muted);
            color: var(--muted);
        }

        .act-btn-toggle:hover {
            background: var(--cyan);
            color: #000;
        }

        /* ── STATUS SELECT ── */
        .status-select {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
        }

        /* ── ADD PRODUCT FORM ── */
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .add-form-wrap {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.75rem;
            margin-bottom: 2rem;
            display: none;
        }

        .add-form-wrap.open {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-sm {
            padding: 0.5rem 1.2rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-sm-primary {
            background: var(--cyan);
            color: #000;
        }

        .btn-sm-primary:hover {
            box-shadow: var(--glow-cyan);
        }

        .btn-sm-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-sm-outline:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .btn-sm-pink {
            background: var(--pink);
            color: #fff;
        }

        .btn-sm-pink:hover {
            box-shadow: var(--glow-pink);
        }

        /* ── ORDER CARDS ── */
        .orders-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .order-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 1.25rem;
            align-items: start;
        }

        .order-prod-img {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: var(--bg3);
        }

        .order-info h4 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .order-info .meta {
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.7;
        }

        .order-info .meta strong {
            color: var(--text);
        }

        .order-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: flex-end;
        }

        @media (max-width: 600px) {
            .admin-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 0.75rem;
            }

            .sidebar-brand {
                margin: 0;
                font-size: 0.9rem;
            }

            .sidebar-nav {
                flex-direction: row;
                gap: 0.25rem;
            }

            .nav-item {
                padding: 0.5rem 0.75rem;
                font-size: 0.78rem;
            }

            .sidebar-footer {
                display: none;
            }

            .order-card {
                grid-template-columns: 60px 1fr;
            }

            .order-actions {
                flex-direction: row;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-card">
            <h2>⚙ Admin Panel</h2>
            <p>Enter your admin password to continue.</p>
            <form id="login-form">
                <div class="form-group">
                    <input type="password" id="login-pass" placeholder="Password" required
                        autocomplete="current-password" />
                </div>
                <button type="submit" class="btn-primary" style="width:100%">Login →</button>
            </form>
            <div id="login-error">❌ Incorrect password</div>
        </div>
    </div>

    <!-- ADMIN LAYOUT -->
    <div class="admin-layout" id="admin-app" style="display:none;">
        <aside class="sidebar">
            <div class="sidebar-brand">⚡ AnimeGear</div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-tab="analytics"><span class="icon">📊</span> Analytics</button>
                <button class="nav-item" data-tab="products"><span class="icon">👕</span> Products</button>
                <button class="nav-item" data-tab="orders"><span class="icon">📦</span> Orders</button>
            </nav>
            <div class="sidebar-footer">
                <a href="../index.html" target="_blank">← View Store</a>
            </div>
        </aside>

        <main class="admin-main">

            <!-- ── ANALYTICS TAB ── -->
            <div class="tab-panel active" id="tab-analytics">
                <div class="admin-header">
                    <h1>📊 Analytics</h1>
                    <button class="btn-sm btn-sm-outline" onclick="loadAnalytics()">↻ Refresh</button>
                </div>
                <div class="stats-grid" id="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Orders</div>
                        <div class="stat-value cyan" id="stat-orders">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Units Sold</div>
                        <div class="stat-value purple" id="stat-units">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Revenue</div>
                        <div class="stat-value pink" id="stat-revenue">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Net Profit</div>
                        <div class="stat-value green" id="stat-profit">—</div>
                    </div>
                </div>
            </div>

            <!-- ── PRODUCTS TAB ── -->
            <div class="tab-panel" id="tab-products">
                <div class="panel-header">
                    <h1 style="font-family:'Orbitron',monospace;font-size:1.4rem;">👕 Products</h1>
                    <button class="btn-sm btn-sm-primary" id="toggle-add-form">+ Add Product</button>
                </div>

                <!-- Add/Edit Form -->
                <div class="add-form-wrap" id="add-form-wrap">
                    <h3 style="margin-bottom:1.25rem;font-size:1rem;font-weight:700;" id="form-title">Add New Product
                    </h3>
                    <form id="product-form" enctype="multipart/form-data">
                        <input type="hidden" id="edit-product-id" value="" />
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Product Name</label>
                                <input type="text" id="pf-name" placeholder="e.g. Cyber Dragon Hoodie" required />
                            </div>
                            <div class="form-group">
                                <label>Category</label>
                                <select id="pf-category">
                                    <option>Anime</option>
                                    <option>Gaming</option>
                                    <option>Summer</option>
                                    <option>Winter</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Price (EGP)</label>
                                <input type="number" id="pf-price" placeholder="599" min="0" required />
                            </div>
                            <div class="form-group">
                                <label>Cost Price (EGP)</label>
                                <input type="number" id="pf-cost" placeholder="250" min="0" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Product Images</label>
                            <input type="file" id="pf-images" accept="image/*" multiple style="color:var(--text);" />
                            <div id="existing-imgs-preview"
                                style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.5rem;"></div>
                        </div>
                        <div style="display:flex;gap:0.75rem;margin-top:0.5rem;">
                            <button type="submit" class="btn-sm btn-sm-primary" id="pf-submit">Save Product</button>
                            <button type="button" class="btn-sm btn-sm-outline"
                                onclick="resetProductForm()">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Products Table -->
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Cost</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-tbody">
                            <tr>
                                <td colspan="7" style="text-align:center;color:var(--muted);padding:2rem;">Loading...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ── ORDERS TAB ── -->
            <div class="tab-panel" id="tab-orders">
                <div class="panel-header">
                    <h1 style="font-family:'Orbitron',monospace;font-size:1.4rem;">📦 Orders</h1>
                    <button class="btn-sm btn-sm-outline" onclick="loadOrders()">↻ Refresh</button>
                </div>
                <div class="orders-grid" id="orders-list">
                    <div style="text-align:center;color:var(--muted);padding:3rem;">Loading orders...</div>
                </div>
            </div>

        </main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/db.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
